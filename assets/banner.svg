<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #38bdf8;
      }

      /* Animated SVG Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes chartPulse {
        0%, 100% { height: 60px; y: 130px; }
        50% { height: 75px; y: 115px; }
      }
      @keyframes chartPulse2 {
        0%, 100% { height: 95px; y: 95px; }
        50% { height: 80px; y: 110px; }
      }
      @keyframes pingDot {
        0% { r: 3; opacity: 1; }
        50% { r: 6; opacity: 0.4; }
        100% { r: 3; opacity: 1; }
      }

      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .glow-orb {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .bar-anim-1 {
        animation: chartPulse 4s ease-in-out infinite;
      }
      .bar-anim-2 {
        animation: chartPulse2 4s ease-in-out infinite;
      }
      .live-dot {
        animation: pingDot 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Orbs (Positioned in Background) -->
  <circle class="glow-orb" cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />
  <circle class="glow-orb" cx="1020" cy="220" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.18" />
  <circle class="glow-orb" cx="650" cy="380" r="120" fill="#c084fc" filter="url(#glow)" opacity="0.12" />

  <!-- Accent Border Line -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT: Header & Badges (Never Obscured) -->
  <g transform="translate(60, 50)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" class="live-dot" />
    <text x="26" y="19" class="badge-text" fill="#38bdf8">ENTERPRISE STORAGE &amp; BI</text>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text">Awesome Executive Reporting</text>
    <text x="0" y="124" class="title-text" fill="url(#accentGrad)">&amp; Storage Analytics</text>

    <!-- Subtitle -->
    <text x="0" y="162" class="subtitle-text">Curated ecosystem of SaaS platforms &amp; open-source BI dashboards for</text>
    <text x="0" y="188" class="subtitle-text">backup infrastructure, capacity forecasting, and multi-cloud telemetry.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 222)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="22" class="badge-text">📊 Capacity Planning</text>

      <!-- Tag 2 -->
      <rect x="162" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="180" y="22" class="badge-text">🛡️ Cyber Resilience</text>

      <!-- Tag 3 -->
      <rect x="324" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="342" y="22" class="badge-text">⚡ Self-Hosted BI</text>

      <!-- Tag 4 -->
      <rect x="486" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="504" y="22" class="badge-text">📈 FinOps &amp; SLA</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Modern Decorative Analytical UI Card (Floating Effect) -->
  <g class="floating-card" transform="translate(790, 60)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="360" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Card Header -->
    <rect x="0" y="0" width="360" height="42" rx="16" fill="#1e293b" fill-opacity="0.6" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" />
    <circle cx="36" cy="21" r="5" fill="#f59e0b" />
    <circle cx="52" cy="21" r="5" fill="#10b981" />
    <text x="80" y="26" class="metric-title" font-weight="600" fill="#94a3b8">INFRASTRUCTURE TELEMETRY</text>

    <!-- Metrics Row -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" class="metric-title">GLOBAL STORAGE POOL</text>
      <text x="0" y="22" class="metric-val">14.8 PB</text>

      <text x="180" y="0" class="metric-title">COMPLIANCE SLA</text>
      <text x="180" y="22" class="metric-val" fill="#10b981">99.98%</text>
    </g>

    <!-- Mini Analytical Chart -->
    <g transform="translate(20, 110)">
      <!-- Baseline Grid -->
      <line x1="0" y1="120" x2="320" y2="120" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="60" x2="320" y2="60" stroke="#334155" stroke-width="0.5" stroke-dasharray="4" />

      <!-- Animated Bars -->
      <rect x="15" y="65" width="22" height="55" rx="4" fill="url(#barGrad1)" />
      <rect x="55" y="45" width="22" height="75" rx="4" fill="url(#barGrad1)" />
      <rect x="95" class="bar-anim-1" x="95" y="60" width="22" height="60" rx="4" fill="url(#barGrad1)" />
      <rect x="135" y="30" width="22" height="90" rx="4" fill="url(#barGrad2)" />
      <rect x="175" class="bar-anim-2" x="175" y="95" width="22" height="95" rx="4" fill="url(#barGrad2)" />
      <rect x="215" y="20" width="22" height="100" rx="4" fill="url(#barGrad2)" />
      <rect x="255" y="40" width="22" height="80" rx="4" fill="url(#barGrad1)" />
      <rect x="295" y="15" width="22" height="105" rx="4" fill="url(#accentGrad)" />

      <!-- Trend Line -->
      <path d="M 26 65 Q 106 35 186 25 T 306 15" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="306" cy="15" r="4" fill="#38bdf8" />
    </g>

    <!-- Mini Footer Badge -->
    <g transform="translate(20, 255)">
      <rect width="320" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" />
      <circle cx="16" cy="14" r="4" fill="#10b981" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" fill="#cbd5e1">Capacity Runway: <tspan fill="#38bdf8" font-weight="700">18.4 Months Remaining</tspan></text>
    </g>
  </g>
</svg>
